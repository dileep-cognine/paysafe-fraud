services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlruns.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:*,api:*"
    ports:
      - "${COMPOSE_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
    image: paysafe-fraud-scoring:local
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${COMPOSE_API_PORT:-8000}:8000"
    environment:
      APP_ENV: prod
      MLFLOW_TRACKING_URI: ${COMPOSE_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${COMPOSE_MLFLOW_EXPERIMENT_NAME:-paysafe-fraud-scoring-prod}
      MODEL_REGISTRY_NAME: ${COMPOSE_MODEL_REGISTRY_NAME:-paysafe-fraud-detector}
      MODEL_ALIAS: ${COMPOSE_MODEL_ALIAS:-champion}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 1
      LOG_LEVEL: ${COMPOSE_LOG_LEVEL:-info}

volumes:
  mlflow-data:
