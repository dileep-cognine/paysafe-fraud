name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type check, test, and validate data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: ci
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Verify resolved dependencies
        run: python -m pip check

      - name: Generate deterministic synthetic training data
        run: |
          python -m fraud_scoring.generate_data --output data/raw/transactions.csv --records 5000 --fraud-ratio 0.04 --seed 42

      - name: Lint
        run: python -m ruff check .

      - name: Formatting check
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src

      - name: Run tests and write JUnit report
        run: |
          mkdir -p reports
          python -m pytest --junitxml=reports/junit.xml

      - name: Run raw-data quality and leakage gate
        run: python -m fraud_scoring.data_validation --data-path data/raw/transactions.csv --mode train

      - name: Reproduce DVC training and evaluation pipeline
        run: python -m dvc repro

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: reports/junit.xml
          if-no-files-found: warn

      - name: Upload evaluation metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-metrics
          path: artifacts/evaluation/metrics.json
          if-no-files-found: warn

  docker-build:
    name: Build Docker image, scan it, and generate SBOM
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: paysafe-fraud-scoring:${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image without pushing it
        run: docker build --tag "$IMAGE_TAG" .

      - name: Prepare image-scan output directory
        run: mkdir -p artifacts/security

      - name: Generate Trivy report for final image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: artifacts/security/trivy-image.json
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "0"

      - name: Upload Trivy image scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-scan-${{ github.sha }}
          path: artifacts/security/trivy-image.json
          if-no-files-found: warn

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SPDX SBOM from final image
        run: |
          mkdir -p sbom
          ${{ steps.syft.outputs.cmd }} "$IMAGE_TAG" -o "spdx-json=sbom/paysafe-fraud-scoring.spdx.json"

      - name: Verify SPDX SBOM content
        run: |
          python -c "import json; sbom = json.load(open('sbom/paysafe-fraud-scoring.spdx.json', encoding='utf-8')); packages = sbom.get('packages', []); assert packages, 'SBOM contains no packages'; print(f'SPDX packages: {len(packages)}')"

      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-sbom-spdx-${{ github.sha }}
          path: sbom/paysafe-fraud-scoring.spdx.json
          if-no-files-found: error

      - name: Enforce fixable high and critical vulnerability gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"

  secret-hygiene:
    name: Verify secret hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source with history for secret scan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify local environment files are ignored
        run: |
          git check-ignore --quiet .env
          ! git ls-files --error-unmatch .env

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
