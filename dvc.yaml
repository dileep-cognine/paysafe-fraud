stages:
  prepare:
    cmd: python -m fraud_scoring.prepare --input-path data/raw/transactions.csv --output-path data/processed/validated.csv
    deps:
      - data/raw/transactions.csv
      - src/fraud_scoring/prepare.py
      - src/fraud_scoring/data_validation.py
      - src/fraud_scoring/features.py
    outs:
      - data/processed/validated.csv

  train:
    cmd: python -m fraud_scoring.train --data-path data/processed/validated.csv --output-path artifacts/model/candidate.joblib
    deps:
      - data/processed/validated.csv
      - src/fraud_scoring/train.py
      - src/fraud_scoring/data_validation.py
      - src/fraud_scoring/data_utils.py
      - src/fraud_scoring/features.py
      - src/fraud_scoring/config.py
      - configs
    outs:
      - artifacts/model/candidate.joblib

  evaluate:
    cmd: python -m fraud_scoring.evaluate --data-path data/processed/validated.csv --model-path artifacts/model/candidate.joblib --output-path artifacts/evaluation/metrics.json
    deps:
      - data/processed/validated.csv
      - artifacts/model/candidate.joblib
      - src/fraud_scoring/evaluate.py
      - src/fraud_scoring/train.py
      - src/fraud_scoring/data_validation.py
      - src/fraud_scoring/features.py
      - src/fraud_scoring/data_utils.py
      - src/fraud_scoring/config.py
      - configs
    metrics:
      - artifacts/evaluation/metrics.json